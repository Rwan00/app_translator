name: app_translator
description: "GlyphScan translation app built with Feature-First Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection & Functional Programming
  get_it: ^8.0.2
  dartz: ^0.10.1

  # Media & Image
  image_picker: ^1.1.2

  # Localization
  easy_localization: ^3.0.7+1

  # Native Splash Screen
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/tokens/
    - assets/translations/
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B0B0B"
  image: "assets/logo/app_logo.png"
  color_dark: "#0B0B0B"
  image_dark: "assets/logo/app_logo.png"
  android_12:
    color: "#0B0B0B"
    image: "assets/logo/app_logo.png"
